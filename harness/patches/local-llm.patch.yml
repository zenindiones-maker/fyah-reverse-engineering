# Rota OpenAI-compatible local (llama.cpp). Placeholder LOCAL_LLM_KEY != chave de nuvem.
- remove:
    - llm-deepseek
- config:
    session-log-deepseek:
      enabled: false
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          local-llamacpp:
            displayName: Local llama.cpp (CPU)
            apiKeyEnv: LOCAL_LLM_KEY
            api: openai-completions
            baseURL: http://127.0.0.1:8080/v1
            compat:
              supportsDeveloperRole: false
              maxTokensField: max_tokens
            models:
              - id: qwen2.5-0.5b
                name: Qwen2.5-0.5B-Instruct (GGUF Q4_K_M)
                contextWindow: 8192
                maxTokens: 512
              - id: qwen2.5-7b
                name: Qwen2.5-7B-Instruct (GGUF Q4_K_M)
                contextWindow: 8192
                maxTokens: 512
              - id: qwen2.5-14b
                name: Qwen2.5-14B-Instruct (GGUF Q3_K_M)
                contextWindow: 4096
                maxTokens: 512
              - id: qwen3-14b
                name: Qwen3-14B (GGUF Q3_K_M)
                contextWindow: 4096
                maxTokens: 512
              - id: qwen3-30b-a3b
                name: Qwen3-30B-A3B-Instruct-2507 (GGUF UD-IQ1_M)
                contextWindow: 4096
                maxTokens: 512
              - id: r1-distill-qwen-14b
                name: DeepSeek-R1-Distill-Qwen-14B (GGUF Q3_K_M)
                contextWindow: 4096
                maxTokens: 512
