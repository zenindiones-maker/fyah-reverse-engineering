# Rota OpenAI-compatible local (llama.cpp). Placeholder LOCAL_LLM_KEY != chave de nuvem.
# Desliga upload de session-log para DeepSeek. Substitui o adapter Anthropic-Messages do sdk-minimal.
- remove:
    - llm-deepseek
- config:
    session-log-deepseek:
      enabled: false
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          local-llamacpp:
            displayName: Local llama.cpp (CPU)
            apiKeyEnv: LOCAL_LLM_KEY
            api: openai-completions
            baseURL: http://127.0.0.1:8080/v1
            compat:
              supportsDeveloperRole: false
              maxTokensField: max_tokens
            models:
              - id: qwen2.5-0.5b
                name: Qwen2.5-0.5B-Instruct (GGUF Q4_K_M)
                contextWindow: 4096
                maxTokens: 1024
              - id: qwen3-4b-instruct
                name: Qwen3-4B-Instruct-2507 (GGUF Q4_K_M)
                contextWindow: 4096
                maxTokens: 1024
              - id: qwen2.5-7b
                name: Qwen2.5-7B-Instruct (GGUF Q4_K_M)
                contextWindow: 4096
                maxTokens: 1024
              - id: qwen3-8b
                name: Qwen3-8B (GGUF Q4_K_M)
                contextWindow: 4096
                maxTokens: 1024
