[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyah-re"
version = "0.0.1"
description = "Biblioteca central de engenharia reversa e análise de mídia da Fyah Records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fyah Records" }]
dependencies = []

[project.optional-dependencies]
audio = ["librosa>=0.10", "pyloudnorm>=0.1.1", "soundfile>=0.12", "numpy>=1.24"]
video = ["scenedetect[opencv-headless]>=0.6.4"]
dev = ["pytest>=8"]

[project.scripts]
fyah-re = "fyah_re_cli:main"

[tool.setuptools]
py-modules = ["fyah_re_cli"]

[tool.setuptools.packages.find]
include = ["audio*", "video*", "formats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
