name: setup-er
description: "Ambiente do E.R. em CPU (custo zero, sem API/token/cadastro). Instala Python, apt, extras pip e, opcionalmente, jadx/Ghidra/capa/FLOSS/dex2jar de releases oficiais (sem commitar binários)."
inputs:
  extras: {description: "Extras do pyproject (ex.: audio,video)", default: "audio"}
  torch: {description: "Instalar torch/torchaudio CPU", default: "false"}
  apt: {description: "Pacotes apt extras", default: ""}
  jadx: {description: "Baixar jadx (release oficial)", default: "false"}
  ghidra: {description: "Baixar Ghidra (release oficial, headless)", default: "false"}
  capa: {description: "Baixar capa (release oficial Mandiant)", default: "false"}
  floss: {description: "Baixar FLOSS (release oficial Mandiant)", default: "false"}
  dextools: {description: "Baixar dex2jar + smali (releases oficiais)", default: "false"}
  python-version: {default: "3.11"}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with: {python-version: "${{ inputs.python-version }}", cache: pip}
    - name: apt
      shell: bash
      env: {EXTRA_APT: "${{ inputs.apt }}"}
      run: |
        sudo apt-get update -qq
        pkgs="ffmpeg mediainfo libmagic1 default-jre-headless radare2 rizin apktool unzip libchromaprint-tools $EXTRA_APT"
        for p in $pkgs; do sudo apt-get install -y -qq --no-install-recommends "$p" >/dev/null 2>&1 || echo "::warning::apt: $p indisponível"; done
    - name: torch CPU
      if: inputs.torch == 'true'
      shell: bash
      run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
    - name: pip extras
      shell: bash
      env: {EXTRAS: "${{ inputs.extras }}", PIP_PREFER_BINARY: "1"}
      run: |
        pip install -q "PyYAML==6.0.2"
        pip install -q -e . --no-deps
        IFS=',' read -ra ES <<< "$EXTRAS"
        for e in "${ES[@]}"; do
          e=$(echo "$e" | xargs)
          [ -z "$e" ] && continue
          echo ">>> pip install [$e]"
          pip install -q -c constraints.txt -e ".[$e]" || echo "::warning::extra $e falhou"
        done
    - name: versões de jadx/Ghidra
      id: rel
      if: inputs.jadx == 'true' || inputs.ghidra == 'true'
      shell: bash
      env: {GH_TOKEN: "${{ github.token }}"}
      run: |
        echo "jadx=$(gh api repos/skylot/jadx/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
        echo "ghidra=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      if: inputs.jadx == 'true'
      with: {path: ~/.er-tools/jadx, key: "jadx-${{ steps.rel.outputs.jadx }}"}
    - name: jadx
      if: inputs.jadx == 'true'
      shell: bash
      env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.rel.outputs.jadx }}"}
      run: |
        d=~/.er-tools/jadx
        if [ ! -x "$d/bin/jadx" ]; then
          mkdir -p "$d" /tmp/jx && gh release download "$TAG" -R skylot/jadx -p "jadx-${TAG#v}.zip" -D /tmp/jx --clobber
          unzip -q -o /tmp/jx/*.zip -d "$d"
        fi
        chmod +x "$d/bin/"*; echo "$d/bin" >> "$GITHUB_PATH"
    - uses: actions/cache@v6
      if: inputs.ghidra == 'true'
      with: {path: ~/.er-tools/ghidra, key: "ghidra-${{ steps.rel.outputs.ghidra }}"}
    - name: Ghidra (headless)
      if: inputs.ghidra == 'true'
      shell: bash
      env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.rel.outputs.ghidra }}"}
      run: |
        d=~/.er-tools/ghidra
        if [ ! -d "$d/current" ]; then
          sudo apt-get install -y -qq openjdk-21-jdk-headless >/dev/null 2>&1 || true
          mkdir -p "$d" /tmp/gh && gh release download "$TAG" -R NationalSecurityAgency/ghidra -p "ghidra_*_PUBLIC_*.zip" -D /tmp/gh --clobber
          unzip -q /tmp/gh/*.zip -d "$d" && mv "$d"/ghidra_* "$d/current"
        fi
        sudo apt-get install -y -qq openjdk-21-jdk-headless >/dev/null 2>&1 || true
        echo "GHIDRA_HOME=$d/current" >> "$GITHUB_ENV"
        echo "$d/current/support" >> "$GITHUB_PATH"
    - uses: actions/cache@v6
      if: inputs.capa == 'true' || inputs.floss == 'true' || inputs.dextools == 'true'
      with: {path: ~/.er-tools, key: "er-releases-v2"}
    - name: Releases oficiais (capa/floss/dex2jar/smali)
      if: inputs.capa == 'true' || inputs.floss == 'true' || inputs.dextools == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ER_CAPA: ${{ inputs.capa == 'true' && '1' || '0' }}
        ER_FLOSS: ${{ inputs.floss == 'true' && '1' || '0' }}
        ER_DEXTOOLS: ${{ inputs.dextools == 'true' && '1' || '0' }}
      run: bash scripts/er_releases.sh
