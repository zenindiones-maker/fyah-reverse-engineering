name: capabilities-e2e
# Custo zero: ubuntu-latest gratuito. Sem GPU, sem API paga, sem merge.
on:
  workflow_dispatch: {}
  pull_request:
    paths-ignore:
      - "docs/ferramentas/STATUS.md"
      - "docs/diario/**"
permissions: {contents: read}
concurrency: {group: "capabilities-e2e-${{ github.ref }}", cancel-in-progress: true}
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -e ".[audio,video,dev]"
      - run: pytest -q tests/test_cli_contract.py tests/test_plan.py tests/test_tools.py tests/test_media_inspect_e2e.py tests/test_rizin_contract.py tests/test_download_safety.py tests/test_execution_contracts.py tests/test_tool_receipts.py
      - name: resumo
        if: always()
        run: |
          {
            echo "## Capabilities E2E"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- pytest do núcleo: ver o passo anterior"
            echo "- fingerprint, midi, stems e rizin: jobs separados desta mesma execução"
          } >> "$GITHUB_STEP_SUMMARY"
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install demucs -e ".[audio]"
      - name: separar um tom autorizado de 3s
        run: |
          python - << 'PY'
          import math, wave
          frames = bytearray()
          sr = 22050
          for i in range(sr * 3):
              value = int(6000 * math.sin(2 * math.pi * 220 * i / sr))
              if i % (sr // 2) < 200:
                  value = max(-32767, min(32767, value + 8000))
              frames.extend(value.to_bytes(2, "little", signed=True))
          with wave.open("tone.wav", "wb") as wav:
              wav.setnchannels(1); wav.setsampwidth(2); wav.setframerate(sr); wav.writeframes(frames)
          PY
          python -m tools run stems --input tone.wav --out out/stems.json
          python - << 'PY'
          import json, pathlib, subprocess
          data = json.loads(pathlib.Path("out/stems.json").read_text())
          assert data["schema"] == "fyah-re/stems@1" and data["ok"] is True
          stems = data["stems"]
          assert len(stems) >= 2, stems
          for stem in stems:
              probe = subprocess.run(["ffprobe", "-v", "error", "-show_streams", "-of", "json", stem], capture_output=True, text=True, check=True)
              streams = json.loads(probe.stdout)["streams"]
              assert streams and streams[0]["codec_type"] == "audio", stem
          print(f"stems validados: {len(stems)}")
          PY
      - uses: actions/upload-artifact@v7
        with: {name: stems-e2e, path: out/, retention-days: 7}
  rizin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: apt não é a fonte confiável
        run: |
          sudo apt-get update -qq
          if sudo apt-get install -y -qq --no-install-recommends rizin; then
            echo "apt instalou rizin"
            command -v rizin || command -v rz-bin
          else
            echo "apt: rizin indisponível neste runner, como esperado"
          fi
      - name: release oficial
        env: {ER_RIZIN: "1", GH_TOKEN: "${{ github.token }}"}
        run: bash scripts/er_releases.sh
      - name: analisar o interpretador Python do runner
        run: |
          mkdir -p out
          bin=$(readlink -f "$(command -v python3)")
          test -n "$bin"
          if command -v rz-bin >/dev/null; then
            rz-bin -I -j "$bin" > out/rizin.json
          else
            rizin -q -c 'iIj' -c q "$bin" > out/rizin.json
          fi
          python - << 'PY'
          import json, pathlib
          raw = pathlib.Path("out/rizin.json").read_text()
          data = json.loads(raw)
          assert data, raw[:200]
          pathlib.Path("out/rizin-report.json").write_text(json.dumps({"ok": True, "target": "python3", "keys": list(data)[:12]}, indent=2))
          print("rizin ok", list(data)[:8])
          PY
      - uses: actions/upload-artifact@v7
        with: {name: rizin-e2e, path: out/, retention-days: 7}
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Chromaprint gratuito
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libchromaprint-tools
      - run: pip install -e . --no-deps
      - name: fingerprint de um WAV gerado e caso negativo
        run: |
          python - << 'PY'
          import hashlib, json, math, pathlib, subprocess, sys, wave
          out = pathlib.Path("out")
          out.mkdir()
          source = pathlib.Path("tone.wav")
          rate = 22050
          frames = bytearray()
          for i in range(rate * 5):
              value = int(8000 * math.sin(2 * math.pi * 440 * i / rate))
              frames.extend(value.to_bytes(2, "little", signed=True))
          with wave.open(str(source), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              wav.writeframes(frames)
          result = subprocess.run(
              [sys.executable, "-m", "tools", "run", "fingerprint", "--input", str(source), "--out", "out/fingerprint.json"],
              capture_output=True, text=True,
          )
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          if result.returncode != 0:
              raise SystemExit(f"fingerprint falhou: {result.returncode}")
          payload = json.loads(pathlib.Path("out/fingerprint.json").read_text())
          assert payload["schema"] == "fyah-re/fingerprint@1"
          assert payload["ok"] is True and payload["lookup"] is False
          assert payload["fingerprint"].strip()
          assert payload["duration_s"] == 5.0
          assert payload["algorithm"] == "chromaprint"
          receipt = json.loads(pathlib.Path("out/fingerprint.json.receipt.json").read_text())
          assert receipt["status"] == "success" and receipt["tool_name"] == "fingerprint"
          assert receipt["output_artifacts"][0]["sha256"] == hashlib.sha256(pathlib.Path("out/fingerprint.json").read_bytes()).hexdigest()
          silence = pathlib.Path("silence.wav")
          silent = b"\x00\x00" * rate * 2
          with wave.open(str(silence), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              wav.writeframes(silent)
          negative = subprocess.run(
              [sys.executable, "-m", "tools", "run", "fingerprint", "--input", str(silence), "--out", "out/silence.json"],
              capture_output=True, text=True,
          )
          assert negative.returncode != 0, negative.stdout
          assert not pathlib.Path("out/silence.json").exists()
          negative_receipt = json.loads(pathlib.Path("out/silence.json.receipt.json").read_text())
          assert negative_receipt["status"] != "success"
          assert negative_receipt["output_artifacts"] == []
          summary = {
              "sha": __import__("os").environ.get("GITHUB_SHA"),
              "fpcalc_version": payload["fpcalc_version"],
              "duration_s": payload["duration_s"],
              "fingerprint_length": len(payload["fingerprint"]),
              "receipt_sha256": receipt["output_artifacts"][0]["sha256"],
              "negative_status": negative_receipt["status"],
              "lookup": False,
          }
          pathlib.Path("out/fingerprint-report.json").write_text(json.dumps(summary, indent=2) + "\n")
          print("fingerprint e2e ok", summary)
          PY
      - uses: actions/upload-artifact@v7
        with: {name: fingerprint-e2e, path: out/, retention-days: 7}
  midi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install -e . --no-deps
      - name: venv isolada basic-pitch 0.4.0
        run: |
          python -m venv .er-venvs/basicpitch
          .er-venvs/basicpitch/bin/pip install -q 'basic-pitch[onnx]==0.4.0' 'numpy<2' 'setuptools<81'
          .er-venvs/basicpitch/bin/pip uninstall -y tflite-runtime ai-edge-litert tensorflow tensorflow-cpu coremltools
      - name: transcrever a referência e os casos negativos
        env:
          FYAH_RE_VENVS: ${{ github.workspace }}/.er-venvs
        run: python scripts/midi_e2e.py
      - uses: actions/upload-artifact@v7
        with: {name: midi-e2e, path: out/, retention-days: 7}


