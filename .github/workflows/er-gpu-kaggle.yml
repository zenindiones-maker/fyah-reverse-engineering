name: er-gpu-kaggle
# Custo zero: GPU grátis do Kaggle (~30 h/semana). Requer secrets KAGGLE_USERNAME e KAGGLE_KEY (HF_TOKEN opcional).
on:
  workflow_dispatch:
    inputs:
      job: {description: "Pasta em kaggle/", default: "stems-gpu"}
      url: {description: "URL do áudio (próprio/licenciado/domínio público)", required: false, default: ""}
      model: {description: "Modelo", default: "htdemucs_ft"}
permissions: {contents: read}
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JOB: ${{ inputs.job }}
      URL: ${{ inputs.url }}
      MODEL: ${{ inputs.model }}
    steps:
      - name: Verificar secrets
        id: chk
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            { echo "## ⚠️ Kaggle não configurado"; echo
              echo "Adicione os secrets **KAGGLE_USERNAME** e **KAGGLE_KEY** em Settings → Secrets and variables → Actions."
              echo "Gere o token em kaggle.com → Settings → API → Create New Token (verifique o telefone para liberar GPU/internet)."; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.chk.outputs.ok == 'true'
        with: {python-version: "3.11"}
      - name: Push do kernel
        if: steps.chk.outputs.ok == 'true'
        run: |
          case "$JOB" in *[!a-zA-Z0-9_-]*|"") echo "job inválido" >&2; exit 1;; esac
          pip install -q kaggle
          d="kaggle/$JOB"; test -f "$d/kernel-metadata.json"
          cp -r "$d" work && cd work
          sed -i "s#KAGGLE_USERNAME#$KAGGLE_USERNAME#" kernel-metadata.json
          python - <<'P'
          import json,os
          cfg={"model":os.environ["MODEL"]}
          if os.environ.get("URL"): cfg["url"]=os.environ["URL"]
          # embute a entrada no script (kernels de script não recebem arquivos extras)
          m=json.load(open("kernel-metadata.json")); f=m["code_file"]; s=open(f).read()
          s=f"import json\njson.dump({json.dumps(cfg)}, open('job_input.json','w'))\n"+s
          open(f,"w").write(s)
          P
          kaggle kernels push -p .
          echo "KID=$(python -c "import json;print(json.load(open('kernel-metadata.json'))['id'])")" >> "$GITHUB_ENV"
      - name: Aguardar
        if: steps.chk.outputs.ok == 'true'
        run: |
          for i in $(seq 1 330); do
            s=$(kaggle kernels status "$KID" 2>&1 || true); echo "$s"
            case "$s" in *complete*|*COMPLETE*) exit 0;; *error*|*ERROR*|*cancel*|*CANCEL*) exit 1;; esac
            sleep 60
          done; exit 1
      - name: Baixar output
        if: always() && steps.chk.outputs.ok == 'true'
        run: |
          mkdir -p out && kaggle kernels output "$KID" -p out || true
          { echo "## Kaggle: $KID"; echo; ls -R out | head -50; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.chk.outputs.ok == 'true'
        with: {name: "kaggle-${{ inputs.job }}", path: out/, retention-days: 14}
