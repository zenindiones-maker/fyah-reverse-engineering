name: er-daily
# Custo zero: rotina de autoaprimoramento em dias úteis ~09:00 BRT. Commita só docs/diario/.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: er-daily, cancel-in-progress: false}
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Gerar diário
        env: {GH_TOKEN: "${{ github.token }}", TZ: America/Sao_Paulo}
        run: |
          f=$(python scripts/er_daily.py)
          echo "f=$f" >> "$GITHUB_ENV"
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit (só docs/diario)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diario
          git diff --cached --quiet && { echo "Sem mudanças"; exit 0; }
          git commit -m "diario: $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase -q && git push
