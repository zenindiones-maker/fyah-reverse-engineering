name: ci
# Custo zero: runner gratuito ubuntu-latest (repo público).
# Ignora commits só de status/diário pra não spammar o Actions (e o Gmail).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/ferramentas/STATUS.md"
      - "docs/diario/**"
  pull_request:
    paths-ignore:
      - "docs/ferramentas/STATUS.md"
      - "docs/diario/**"
  workflow_dispatch: {}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - name: Instalar dependência de sistema do E2E
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libchromaprint-tools
          command -v ffprobe
          command -v fpcalc
      - run: pip install -e ".[audio,video,dev]"
      - run: pytest -q
