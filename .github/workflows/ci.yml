name: ci
# Custo zero: runner gratuito ubuntu-latest (repo público).
# Ignora commits só de status/diário pra não spammar o Actions (e o Gmail).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/ferramentas/STATUS.md"
      - "docs/diario/**"
  pull_request:
    paths-ignore:
      - "docs/ferramentas/STATUS.md"
      - "docs/diario/**"
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[audio,video,dev]"
      - run: pytest -q
