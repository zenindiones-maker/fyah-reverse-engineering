name: er-analyze
# Custo zero: ponto único de entrada (celular → Run workflow). Inputs via env (sem injeção). Sem API/token/cadastro.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Ferramenta ou pipeline"
        type: choice
        options: [audio-profile, compare, media-inspect, cuts-pacing, stems, apk-inspect, audio-full, video-full, apk-full, binary-inspect]
        default: media-inspect
      url: {description: "URL do arquivo (próprio/licenciado/domínio público; APK open source, ex.: F-Droid)", required: true}
      url2: {description: "Segunda URL (só para compare)", required: false, default: ""}
permissions: {contents: read}
concurrency: {group: "er-analyze-${{ github.ref }}", cancel-in-progress: true}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TOOL: ${{ inputs.tool }}
      URL: ${{ inputs.url }}
      URL2: ${{ inputs.url2 }}
    steps:
      - uses: actions/checkout@v7
      - name: Escolher dependências
        id: deps
        run: |
          case "$TOOL" in
            media-inspect) echo "extras=audio" >> "$GITHUB_OUTPUT" ;;
            cuts-pacing|video-full) echo "extras=audio,video" >> "$GITHUB_OUTPUT" ;;
            apk-inspect) echo "extras=apps" >> "$GITHUB_OUTPUT" ;;
            apk-full) echo "extras=apps" >> "$GITHUB_OUTPUT"; echo "jadx=true" >> "$GITHUB_OUTPUT"; echo "dextools=true" >> "$GITHUB_OUTPUT" ;;
            binary-inspect) echo "extras=formats,binary" >> "$GITHUB_OUTPUT"; echo "capa=true" >> "$GITHUB_OUTPUT"; echo "floss=true" >> "$GITHUB_OUTPUT" ;;
            stems|audio-full) echo "extras=audio,ml" >> "$GITHUB_OUTPUT"; echo "torch=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "extras=audio" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: ./.github/actions/setup-er
        with:
          extras: ${{ steps.deps.outputs.extras }}
          torch: ${{ steps.deps.outputs.torch || 'false' }}
          jadx: ${{ steps.deps.outputs.jadx || 'false' }}
          capa: ${{ steps.deps.outputs.capa || 'false' }}
          floss: ${{ steps.deps.outputs.floss || 'false' }}
          dextools: ${{ steps.deps.outputs.dextools || 'false' }}
      - uses: actions/cache/restore@v6
        if: inputs.tool == 'audio-full'
        with: {path: ~/.er-venvs, key: "er-venvs-${{ hashFiles('scripts/er_venvs.sh') }}"}
      - uses: actions/cache@v6
        if: inputs.tool == 'stems' || inputs.tool == 'audio-full'
        with: {path: ~/.cache/torch/hub/checkpoints, key: demucs-htdemucs-v1}
      - name: Baixar entrada
        run: |
          case "$URL" in http://*|https://*) ;; *) echo "URL inválida" >&2; exit 1;; esac
          curl -L --fail --max-filesize 2000000000 -A "fyah-re (GitHub Actions)" -o input.bin "$URL"
          if [ "$TOOL" = compare ]; then
            [ -n "$URL2" ] || { echo "compare exige url2" >&2; exit 1; }
            curl -L --fail -A "fyah-re (GitHub Actions)" -o input2.bin "$URL2"
          fi
      - name: Rodar
        run: python scripts/er_analyze.py "$TOOL" input.bin input2.bin
      - uses: actions/upload-artifact@v7
        with: {name: "er-${{ inputs.tool }}", path: out/, retention-days: 30}
