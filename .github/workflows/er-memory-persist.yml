name: er-memory-persist

# Prova A→B→C de fila durável + recover. SOMENTE workflow_dispatch na branch de validação.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: er-memory-persist-${{ github.ref }}
  cancel-in-progress: false

env:
  AIMEM_SYNC_BACKOFF: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abortar se main
        run: |
          set -euo pipefail
          echo "ref_name=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "::error::er-memory-persist não pode rodar em main"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "p0a-fila-handoffs" ]; then
            echo "::warning::ref inesperada (${GITHUB_REF_NAME}); esperado p0a-fila-handoffs"
          fi

  job-a:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      handoff_id: ${{ steps.create.outputs.handoff_id }}
      handoff_sha256: ${{ steps.create.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - uses: ./.github/actions/setup-aimemory
        with: {seed: "false"}
      - name: Guard ref
        run: test "${GITHUB_REF_NAME}" != "main"
      - id: create
        name: Criar handoff conhecido e sync
        env:
          AIMEM_SYNC_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, datetime as dt
          mem = pathlib.Path("docs/memory")
          fila = mem / "handoffs" / "fila"
          fila.mkdir(parents=True, exist_ok=True)
          hid = "persist-prova-a-" + os.environ["GITHUB_RUN_ID"]
          now = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          item = {
            "schema": "fyah-handoff@1", "id": hid, "state": "pending",
            "summary": "prova persistência job A→B (conteúdo conhecido)",
            "next_steps": ["job-B deve consumir"], "open_questions": [],
            "files_touched": [],
            "origin": {"workflow": os.environ.get("GITHUB_WORKFLOW"), "run_id": os.environ["GITHUB_RUN_ID"],
                       "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
                       "sha": os.environ.get("GITHUB_SHA"), "session": "prova-a",
                       "agent": "er-memory-persist", "created_utc": now},
            "consumer": None, "consumed": None, "attempts": 0, "max_attempts": 3,
            "history": [{"at": now, "from": None, "to": "pending", "by": "job-a", "reason": "prova A"}],
          }
          path = fila / f"{hid}.json"
          raw = json.dumps(item, indent=2, ensure_ascii=False) + "\n"
          path.write_text(raw)
          digest = hashlib.sha256(raw.encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"handoff_id={hid}\n")
              o.write(f"handoff_sha256={digest}\n")
          print("id", hid, "sha256", digest)
          PY
          python -m aimem seed || true
          bash scripts/aimem_commit.sh er-memory-persist-A
          # confirmar tip remoto da branch tem o arquivo
          HID=$(grep '^handoff_id=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          git fetch origin "${GITHUB_REF_NAME}"
          git show "origin/${GITHUB_REF_NAME}:docs/memory/handoffs/fila/${HID}.json" >/dev/null

  job-b:
    needs: job-a
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - uses: ./.github/actions/setup-aimemory
      - name: Guard ref
        run: test "${GITHUB_REF_NAME}" != "main"
      - name: Verificar sha256 do A e consumir
        env:
          AIMEM_SYNC_REF: ${{ github.ref_name }}
          HAND_ID: ${{ needs.job-a.outputs.handoff_id }}
          HAND_SHA: ${{ needs.job-a.outputs.handoff_sha256 }}
          AIMEM_CLAIM_ID: ${{ needs.job-a.outputs.handoff_id }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- "docs/memory/handoffs/fila/${HAND_ID}.json"
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          p = pathlib.Path("docs/memory/handoffs/fila") / (os.environ["HAND_ID"] + ".json")
          raw = p.read_bytes()
          dig = hashlib.sha256(raw).hexdigest()
          assert dig == os.environ["HAND_SHA"], (dig, os.environ["HAND_SHA"])
          item = json.loads(raw)
          assert item["state"] == "pending", item["state"]
          print("sha256 ok", dig)
          PY
          python -m aimem seed
          # claim → effect → confirm via session
          python -m aimem session --agent er-memory-persist --label prova-B -- true
          bash scripts/aimem_commit.sh er-memory-persist-B
      - name: Idempotência (segunda sessão não reconome)
        env:
          AIMEM_SYNC_REF: ${{ github.ref_name }}
          HAND_ID: ${{ needs.job-a.outputs.handoff_id }}
          AIMEM_CLAIM_ID: ${{ needs.job-a.outputs.handoff_id }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          before=$(python -m aimem fila --json)
          hist_before=$(python - <<PY
          import json,os,pathlib
          p=pathlib.Path("docs/memory/handoffs/fila")/(os.environ["HAND_ID"]+".json")
          print(json.dumps(json.loads(p.read_text())["history"], sort_keys=True))
          PY
          )
          eff_before=$(find docs/memory/handoffs/efeitos -name '*.json' 2>/dev/null | wc -l)
          python -m aimem seed
          python -m aimem session --agent er-memory-persist --label prova-B-retry -- true
          bash scripts/aimem_commit.sh er-memory-persist-B-retry || true
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- docs/memory/handoffs
          hist_after=$(python - <<PY
          import json,os,pathlib
          p=pathlib.Path("docs/memory/handoffs/fila")/(os.environ["HAND_ID"]+".json")
          item=json.loads(p.read_text())
          assert item["state"]=="consumed", item["state"]
          print(json.dumps(item["history"], sort_keys=True))
          PY
          )
          eff_after=$(find docs/memory/handoffs/efeitos -name '*.json' 2>/dev/null | wc -l)
          test "$hist_before" = "$hist_after"
          test "$eff_before" -eq "$eff_after"
          echo "idempotência ok hist/efeitos inalterados"

  job-c:
    needs: [job-a, job-b]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - name: Guard ref + main intacto
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "main"
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "main=$main_sha"
          test "$main_sha" = "4ffade0153ce9a3ffd69cf532c7b0c3f282bb92b"
      - name: Consumed uma vez no remoto
        env:
          HAND_ID: ${{ needs.job-a.outputs.handoff_id }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- "docs/memory/handoffs/fila/${HAND_ID}.json"
          python - <<'PY'
          import json, os, pathlib
          item = json.loads((pathlib.Path("docs/memory/handoffs/fila")/(os.environ["HAND_ID"]+".json")).read_text())
          assert item["state"] == "consumed"
          consumed = [h for h in item["history"] if h.get("to") == "consumed"]
          assert len(consumed) == 1, consumed
          print("consumed once ok")
          PY
      - name: Recover handoff perdido (2× idempotente)
        env:
          AIMEM_SYNC_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # blob original
          orig=$(git cat-file -p 4a0ec59:docs/memory/handoffs/aberto.json)
          orig_sha=$(printf '%s' "$orig" | sha256sum | awk '{print $1}')
          echo "orig_sha=$orig_sha"
          python -m aimem recover --commit 4a0ec59 --overwritten-by 4ffade0 --by "er-memory-persist-C"
          id1=$(python -m aimem fila --json | python -c "import json,sys; items=json.load(sys.stdin); print([i['id'] for i in items if (i.get('recovery') or {}).get('from_commit')=='4a0ec59'][0])")
          bash scripts/aimem_commit.sh er-memory-persist-recover
          python -m aimem recover --commit 4a0ec59 --overwritten-by 4ffade0 --by "er-memory-persist-C"
          ids=$(python -m aimem fila --json | python -c "import json,sys; items=json.load(sys.stdin); print(len([i for i in items if (i.get('recovery') or {}).get('from_commit')=='4a0ec59']))")
          test "$ids" = "1"
          python - <<PY
          import json, pathlib, os, hashlib
          items = list(pathlib.Path("docs/memory/handoffs/fila").glob("*.json"))
          rec = [json.loads(p.read_text()) for p in items if (json.loads(p.read_text()).get("recovery") or {}).get("from_commit")=="4a0ec59"]
          assert len(rec)==1
          r = rec[0]["recovery"]
          assert r["overwritten_by_commit"] == "4ffade0"
          assert r["original_sha256"] == "$orig_sha"
          print("recover ok", rec[0]["id"])
          PY
          bash scripts/aimem_commit.sh er-memory-persist-recover-2
      - name: main ainda 4ffade0
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$main_sha" = "4ffade0153ce9a3ffd69cf532c7b0c3f282bb92b"
