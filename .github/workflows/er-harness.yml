name: er-harness
# Custo zero: DSH + llama.cpp local (CPU). Placeholder LOCAL_LLM_KEY hardcoded (não é secret).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo (fast=0.5B; qwen3-4b; qwen25-7b; qwen3-8b)"
        required: true
        default: qwen25-14b
        type: choice
        options: [fast, qwen25-7b, qwen25-14b, qwen3-14b, qwen3-30b-a3b, r1-14b]
      task:
        description: "Tarefa para o E.R."
        required: true
        default: "Inspecione a mídia (media-inspect) e rode audio-full no clip. Use bash."
      url:
        description: "URL do arquivo (próprio/licenciado/domínio público)"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/4/40/Toreador_song_cleaned.ogg"
concurrency:
  group: er-harness-${{ github.event.inputs.model || 'default' }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LOCAL_LLM_KEY: local-no-cloud-key
      ER_TOOLS_DIR: ${{ github.workspace }}/.er-tools
      MODEL_PRESET: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg mediainfo
      - name: pip (fyah + DSH)
        run: |
          pip install -q -e ".[audio]" "deepseek-harness-sdk==0.1.5rc1"
      - name: Resolve cache key
        id: meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("harness/models.json"))[os.environ["MODEL_PRESET"]]
          print(f"cache_key={m['cache_key']}")
          print(f"model_id={m['id']}")
          print(f"model_name={m['name']}")
          PY
      - uses: actions/cache@v6
        with:
          path: |
            .er-tools/models
            .er-tools/llama
          key: ${{ steps.meta.outputs.cache_key }}
      - name: Free RAM / disk
        run: |
          free -h || true
          df -h . || true
      - name: Start llama-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p out
          /usr/bin/time -f 'llama_ready_wall_sec=%e' -o out/timing_server.txt bash -c '
            bash harness/run_local_llm.sh > llama.log 2>&1 &
            echo $! > llama.pid
            ok=0
            for i in $(seq 1 600); do
              if curl -sf http://127.0.0.1:8080/v1/models >/tmp/models.json; then ok=1; break; fi
              if ! kill -0 "$(cat llama.pid)" 2>/dev/null; then
                echo "llama-server morreu; log:"; tail -120 llama.log; exit 1
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then echo "timeout"; tail -120 llama.log; exit 1; fi
          '
          head -c 800 /tmp/models.json; echo
          cp llama.log out/ || true
          cat out/timing_server.txt || true

      - name: Smoke chat/completions
        run: |
          set -e
          MODEL_ID=$(python3 -c "import json,os; print(json.load(open('harness/models.json'))[os.environ['MODEL_PRESET']]['id'])")
          echo "model_id=$MODEL_ID"
          # A) trivial completion
          curl -sS http://127.0.0.1:8080/v1/chat/completions             -H 'Content-Type: application/json'             -d "{\"model\":\"$MODEL_ID\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly PONG and nothing else.\"}],\"max_tokens\":32,\"temperature\":0}"             | tee out/smoke_pong.json
          python3 - <<'PY'
          import json
          d=json.load(open("out/smoke_pong.json"))
          msg=(d.get("choices") or [{}])[0].get("message") or {}
          print("PONG_CONTENT=", repr(msg.get("content")))
          print("FINISH=", (d.get("choices") or [{}])[0].get("finish_reason"))
          print("USAGE=", d.get("usage"))
          PY
          # B) tool-ish instruction (no DSH)
          curl -sS http://127.0.0.1:8080/v1/chat/completions             -H 'Content-Type: application/json'             -d "{\"model\":\"$MODEL_ID\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a helpful assistant. Output one bash command only.\"},{\"role\":\"user\",\"content\":\"Print the command to run: python -m tools run media-inspect --input u.ogg --out out/m.json\"}],\"max_tokens\":128,\"temperature\":0}"             | tee out/smoke_tool.json
          python3 - <<'PY'
          import json
          d=json.load(open("out/smoke_tool.json"))
          msg=(d.get("choices") or [{}])[0].get("message") or {}
          print("TOOL_CONTENT=", repr((msg.get("content") or "")[:500]))
          print("FINISH=", (d.get("choices") or [{}])[0].get("finish_reason"))
          print("USAGE=", d.get("usage"))
          PY


      - name: Smoke tools API (DSH-shaped)
        run: |
          set -e
          python3 - <<'PY'
          import json, urllib.request, os
          mid=json.load(open("harness/models.json"))[os.environ["MODEL_PRESET"]]["id"]
          body={
            "model": mid,
            "messages":[
              {"role":"system","content":"You are E.R. Use the bash tool."},
              {"role":"user","content":"Run: python -m tools run media-inspect --input https://example.com/a.ogg --out out/m.json"}
            ],
            "tools":[{
              "type":"function",
              "function":{
                "name":"bash",
                "description":"Run a bash command",
                "parameters":{"type":"object","properties":{"command":{"type":"string"}},"required":["command"]}
              }
            }],
            "tool_choice":"auto",
            "max_tokens":256,
            "temperature":0
          }
          req=urllib.request.Request(
            "http://127.0.0.1:8080/v1/chat/completions",
            data=json.dumps(body).encode(),
            headers={"Content-Type":"application/json"},
          )
          raw=urllib.request.urlopen(req, timeout=900).read()
          open("out/smoke_tools_api.json","wb").write(raw)
          d=json.loads(raw)
          ch=(d.get("choices") or [{}])[0]
          msg=ch.get("message") or {}
          print("TOOLS_CONTENT=", repr((msg.get("content") or "")[:400]))
          print("TOOL_CALLS=", repr(msg.get("tool_calls"))[:1000])
          print("FINISH=", ch.get("finish_reason"))
          print("USAGE=", d.get("usage"))
          PY

      - name: Run DSH headless (score tool-use BEFORE fallback)
        id: dsh
        continue-on-error: true
        run: |
          mkdir -p out
          /usr/bin/time -f 'dsh_wall_sec=%e' -o out/timing_dsh.txt \
            python harness/run_dsh.py \
              --model-preset "$MODEL_PRESET" \
              --task "${{ inputs.task }}" \
              --file-url "${{ inputs.url }}" \
              --workspace "$GITHUB_WORKSPACE" \
              --dsh-home "$GITHUB_WORKSPACE/.er-dsh-home" \
              --out out/harness.json || true
          # Snapshot artifacts produced by DSH alone
          python3 - <<'PY'
          import json, pathlib, shutil
          out = pathlib.Path("out")
          snap = out / "dsh_only"
          snap.mkdir(exist_ok=True)
          for name in ("media-inspect.json", "audio-full.json", "harness.json"):
              p = out / name
              if p.exists():
                  shutil.copy2(p, snap / name)
          h = json.loads((out/"harness.json").read_text()) if (out/"harness.json").exists() else {}
          score = (h.get("tool_use") or {})
          print(json.dumps({"preset": h.get("model_preset"), "ok": h.get("ok"), "elapsed_sec": h.get("elapsed_sec"), "tool_use": score}, indent=2))
          pathlib.Path("out/score.json").write_text(json.dumps({
              "model_preset": h.get("model_preset"),
              "model": h.get("model"),
              "model_name": h.get("model_name"),
              "ok": h.get("ok"),
              "elapsed_sec": h.get("elapsed_sec"),
              "tool_use": score,
              "dsh_produced_media_inspect": (snap/"media-inspect.json").exists(),
              "dsh_produced_audio_full": (snap/"audio-full.json").exists(),
          }, indent=2))
          PY
          # Fallback (does NOT count toward tool_use score): ensure JSON still lands
          python -m tools run media-inspect --input "${{ inputs.url }}" --out out/media-inspect.json || true
          python -m tools run audio-full --input "${{ inputs.url }}" --out out/audio-full.json || true
          {
            echo "## er-harness"
            echo
            echo "Preset: \`$MODEL_PRESET\` — ${{ steps.meta.outputs.model_name }}"
            echo
            echo '### score'
            echo '```json'
            cat out/score.json || true
            echo '```'
            echo
            echo '### harness (trunc)'
            echo '```json'
            head -c 4000 out/harness.json || true
            echo
            echo '```'
            echo
            echo '### timings'
            echo '```'
            cat out/timing_server.txt out/timing_dsh.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop server
        if: always()
        run: kill "$(cat llama.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: er-harness-${{ inputs.model }}
          path: |
            out/
            llama.log
            .er-dsh-home/
          retention-days: 14
          if-no-files-found: warn
