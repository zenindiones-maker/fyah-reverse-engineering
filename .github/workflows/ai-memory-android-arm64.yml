name: ai-memory v2.6.4 Android ARM64 experiment

on:
  push:
    branches:
      - ai-memory-v2.6.4-android-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-memory-v264-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-arm64:
    name: Cross-compile official ai-memory for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout official source at v2.6.4
        uses: actions/checkout@v4
        with:
          repository: akitaonrails/ai-memory
          ref: v2.6.4
          path: ai-memory-src
          persist-credentials: false

      - name: Install Android NDK without setup-android wrapper
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk and assert Android Rust target
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android --toolchain stable
          rustup target list --installed --toolchain stable | tee rust-targets.txt
          grep -qx 'aarch64-linux-android' rust-targets.txt
          rustc +stable --print target-libdir --target aarch64-linux-android
          test -d "$(rustc +stable --print target-libdir --target aarch64-linux-android)"

      - name: Record source and toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source=https://github.com/akitaonrails/ai-memory"
            echo "tag=v2.6.4"
            echo "commit=$(git -C ai-memory-src rev-parse HEAD)"
            echo "target=aarch64-linux-android"
            echo "android_abi=arm64-v8a"
            echo "ndk=27.2.12479018"
            rustc --version
            cargo --version
            cargo ndk --version
            echo "installed_rust_targets:"
            rustup target list --installed --toolchain stable
            echo "android_target_libdir=$(rustc +stable --print target-libdir --target aarch64-linux-android)"
          } | tee build-evidence.txt

      - name: Build official CLI for Android ARM64
        working-directory: ai-memory-src
        env:
          CARGO_BUILD_JOBS: "2"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android --toolchain stable
          test -d "$(rustc +stable --print target-libdir --target aarch64-linux-android)"
          cargo +stable ndk -t arm64-v8a build --locked --release --package ai-memory-cli --bin ai-memory

      - name: Validate binary format and create checksum
        shell: bash
        run: |
          set -euo pipefail
          BIN="ai-memory-src/target/aarch64-linux-android/release/ai-memory"
          test -s "$BIN"
          file "$BIN" | tee -a build-evidence.txt
          readelf -h "$BIN" | tee -a build-evidence.txt
          readelf -l "$BIN" | tee -a build-evidence.txt
          sha256sum "$BIN" | tee ai-memory-android-arm64.sha256
          cp "$BIN" ai-memory-android-arm64
          test -s ai-memory-android-arm64

      - name: Upload binary and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-memory-v2.6.4-android-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            ai-memory-android-arm64
            ai-memory-android-arm64.sha256
            build-evidence.txt
